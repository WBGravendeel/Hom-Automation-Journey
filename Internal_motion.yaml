blueprint:
  name: Internal motion sensor
  description: >
    Sends a notification when motion is detected, with a camera snapshot
    if a camera is selected (text-only otherwise).
    By default only fires when none of the selected people are home.
    Optionally also fires during a night window (even when people are
    home), or always with the "Always Alert" toggle.

    Prerequisites (only needed if you use a camera):
    - Add to configuration.yaml and restart HA:

        homeassistant:
          media_dirs:
            local: /media
          allowlist_external_dirs:
            - '/media'

    - Create the snapshots folder (Terminal/SSH):
        mkdir -p /media/snapshots
  domain: automation
  input:
    motion_sensor:
      name: Motion Sensor
      description: The binary sensor that detects motion near the camera.
      selector:
        entity:
          domain: binary_sensor
          device_class: motion

    camera:
      name: Camera (optional)
      description: >
        The camera to take a snapshot from when motion is detected.
        Leave empty to send a text-only notification.
      default: ""
      selector:
        entity:
          domain: camera

    people:
      name: People
      description: >
        The alert only fires when ALL of these people are away from home.
        Ignored if "Always Alert" is enabled. If left empty, the alert
        always fires.
      default: []
      selector:
        entity:
          domain: person
          multiple: true

    always_alert:
      name: Always Alert
      description: >
        If enabled, sends notifications regardless of whether people are
        home or not.
      default: false
      selector:
        boolean: {}

    night_window_enabled:
      name: Night Window
      description: >
        If enabled, motion during the night window always triggers an
        alert, even when people are home.
      default: false
      selector:
        boolean: {}

    night_start:
      name: Night Window Start
      default: "23:00:00"
      selector:
        time: {}

    night_end:
      name: Night Window End
      description: May be earlier than the start time (window crosses midnight).
      default: "06:00:00"
      selector:
        time: {}

    notify_service:
      name: Notification Service
      description: >
        The name of your notify service — just the part after "notify.",
        e.g. "mobile_app_my_phone". Find yours under Developer Tools →
        Actions → search "notify".
      selector:
        text: {}

    notification_title:
      name: Notification Title
      default: "Motion Detected"
      selector:
        text: {}

variables:
  camera: !input camera
  people: !input people
  always_alert: !input always_alert
  night_window_enabled: !input night_window_enabled
  notify_service: !input notify_service
  notification_title: !input notification_title
  has_camera: "{{ camera is string and camera | length > 0 }}"
  # One timestamp, so the saved file and the URL in the notification always match
  stamp: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
  snapshot_file: "/media/snapshots/motion_{{ stamp }}.jpg"
  snapshot_url: "/media/local/snapshots/motion_{{ stamp }}.jpg"
  message: "Motion detected at {{ now().strftime('%H:%M:%S on %d %B %Y') }}."

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    from: "off"
    to: "on"

conditions:
  - condition: or
    conditions:
      # Always Alert is on
      - condition: template
        value_template: "{{ always_alert }}"
      # Nobody (of the selected people) is home
      - condition: template
        value_template: "{{ people | select('is_state', 'home') | list | count == 0 }}"
      # Night window is enabled and we're inside it
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ night_window_enabled }}"
          - condition: time
            after: !input night_start
            before: !input night_end

actions:
  - if: "{{ has_camera }}"
    then:
      - action: camera.snapshot
        target:
          entity_id: "{{ camera }}"
        data:
          filename: "{{ snapshot_file }}"
      - action: "notify.{{ notify_service }}"
        data:
          title: "{{ notification_title }}"
          message: "{{ message }}"
          data:
            image: "{{ snapshot_url }}"
    else:
      - action: "notify.{{ notify_service }}"
        data:
          title: "{{ notification_title }}"
          message: "{{ message }}"

mode: single
max_exceeded: silent
