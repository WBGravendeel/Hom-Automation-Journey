blueprint:
  name: Camera Motion Alert (Nobody Home) V4
  description: >
    Sends a notification with a camera image when motion is detected.
    By default it only fires when none of the selected people are home.
    You can also make it always fire, or always fire during a night-time
    window. Optionally sends critical notifications that bypass silent
    mode / Do Not Disturb, and optionally saves each snapshot to your
    media folder.

    No server-side setup is needed. Without saved snapshots, the image
    comes from Home Assistant's built-in camera proxy. With saved
    snapshots, the image is the exact frame captured at the moment of
    motion, stored in your default media folder (visible in the Media
    panel). A video clip can be saved alongside it. Note: Home Assistant
    does not delete old snapshots or videos for you.
  domain: automation
  input:
    motion_sensor:
      name: Motion Sensor
      description: The binary sensor that detects motion near the camera.
      selector:
        entity:
          domain: binary_sensor
          device_class: motion

    camera:
      name: Camera
      description: The camera whose image is attached to the notification.
      selector:
        entity:
          domain: camera

    people:
      name: People
      description: >
        The alert fires when ALL of these people are away from home.
        Not checked when "Always Alert" is on, or during the night window
        when "Always Alert at Night" is on.
      default: []
      selector:
        entity:
          domain: person
          multiple: true

    always_alert:
      name: Always Alert
      description: Send notifications regardless of who is home.
      default: false
      selector:
        boolean: {}

    night_mode:
      name: Always Alert at Night
      description: >
        Send notifications regardless of who is home during the time
        window below.
      default: false
      selector:
        boolean: {}

    night_start:
      name: Night Window Start
      description: Start of the night window. Can be before midnight.
      default: "22:00:00"
      selector:
        time: {}

    night_end:
      name: Night Window End
      description: End of the night window. Can be after midnight.
      default: "07:00:00"
      selector:
        time: {}

    critical:
      name: Critical Notifications
      description: >
        Notifications bypass silent mode and Do Not Disturb.
        iOS: allow Critical Alerts for the Home Assistant app when asked
        (or under iOS Settings → Notifications → Home Assistant).
        Android: uses the "alarm_stream" channel, which plays even on silent.
      default: false
      selector:
        boolean: {}

    save_snapshots:
      name: Save Snapshots
      description: >
        Save a snapshot to the media folder on every alert and attach that
        exact frame to the notification. When off, the notification shows
        a live frame from the camera proxy and nothing is stored.
      default: false
      selector:
        boolean: {}

    media_root:
      name: Media Folder (install type)
      description: >
        Where your default media folder is. Home Assistant OS and
        Supervised use /media. Container and Core installs use
        /config/media. Only used when "Save Snapshots" or "Save Video Clip" is on.
      default: "/media"
      selector:
        select:
          options:
            - label: "Home Assistant OS / Supervised (/media)"
              value: "/media"
            - label: "Container / Core (/config/media)"
              value: "/config/media"

    snapshot_subfolder:
      name: Snapshot Subfolder
      description: >
        Subfolder inside the media folder for snapshots. It is created
        automatically. Only used when "Save Snapshots" or "Save Video Clip" is on.
      default: "snapshots"
      selector:
        text: {}

    save_video:
      name: Save Video Clip
      description: >
        Record a video clip on every alert, saved next to the snapshots in
        the media folder above. Requires a camera that supports streaming
        (e.g. RTSP); cameras that only provide still images can't record.
      default: false
      selector:
        boolean: {}

    video_duration:
      name: Video Length
      description: How many seconds to record after motion is detected.
      default: 20
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: seconds
          mode: slider

    video_lookback:
      name: Video Lookback
      description: >
        Seconds of footage from BEFORE the motion to include. Only works if
        "Preload camera stream" is turned on in the camera entity's
        settings; otherwise leave this at 0.
      default: 0
      selector:
        number:
          min: 0
          max: 10
          step: 1
          unit_of_measurement: seconds
          mode: slider

    notify_devices:
      name: Phones to Notify
      description: >
        The phones that receive the alert. Only devices with the Home
        Assistant Companion App installed and logged in are listed.
      selector:
        device:
          multiple: true
          filter:
            - integration: mobile_app

    tap_action:
      name: When Tapping the Notification
      description: >
        What the Home Assistant app opens when you tap the notification.
        "Camera" opens the camera's live view. "Media browser" opens the
        media browser, where snapshots and videos are under My media.
      default: camera
      selector:
        select:
          options:
            - label: "Open the camera (live view)"
              value: camera
            - label: "Open the media browser"
              value: media
            - label: "Open a dashboard (path below)"
              value: custom
            - label: "Do nothing (just open the app)"
              value: none

    tap_path:
      name: Dashboard Path
      description: >
        The page to open when "Open a dashboard" is selected above, e.g.
        "/lovelace/cameras". Copy it from the address bar after your
        Home Assistant URL.
      default: "/lovelace/0"
      selector:
        text: {}

    persistent:
      name: Also Log in Home Assistant
      description: >
        Also add each alert to the notifications list in Home Assistant
        (the bell icon in the sidebar), so you can read past alerts in
        the app after dismissing them on your phone.
      default: false
      selector:
        boolean: {}

    notification_title:
      name: Notification Title
      default: "Motion Detected"
      selector:
        text: {}

variables:
  people: !input people
  always_alert: !input always_alert
  night_mode: !input night_mode
  night_start: !input night_start
  night_end: !input night_end
  critical: !input critical
  save_snapshots: !input save_snapshots
  media_root: !input media_root
  snapshot_subfolder: !input snapshot_subfolder
  save_video: !input save_video
  video_duration: !input video_duration
  video_lookback: !input video_lookback
  notify_devices: !input notify_devices
  notify_services: >-
    {% set ns = namespace(s=[]) %}
    {% for d in notify_devices %}
      {% set ns.s = ns.s + ['mobile_app_' ~ (device_attr(d, 'name') | slugify)] %}
    {% endfor %}
    {{ ns.s }}
  notification_title: !input notification_title
  tap_action: !input tap_action
  tap_path: !input tap_path
  persistent: !input persistent
  tap_target: >-
    {% if tap_action == 'camera' %}entityId:{{ camera_entity }}
    {%- elif tap_action == 'media' %}/media-browser
    {%- elif tap_action == 'custom' %}{{ tap_path | trim }}
    {%- endif %}
  alert_time: "{{ now().strftime('%H:%M:%S on %d %B %Y') }}"
  camera_entity: !input camera
  is_night: >-
    {% set t = now().strftime('%H:%M:%S') %}
    {% if night_start <= night_end %}
      {{ night_start <= t < night_end }}
    {% else %}
      {{ t >= night_start or t < night_end }}
    {% endif %}
  nobody_home: >-
    {{ people | select('is_state', 'home') | list | count == 0 }}
  stamp: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
  subfolder: >-
    {{ snapshot_subfolder | trim | regex_replace('^/+|/+$', '') }}
  snapshot_name: "motion_{{ stamp }}.jpg"
  snapshot_file: >-
    {{ media_root ~ ('/' ~ subfolder if subfolder else '') ~ '/' ~ snapshot_name }}
  snapshot_url: >-
    {{ '/media/local' ~ ('/' ~ subfolder if subfolder else '') ~ '/' ~ snapshot_name }}
  video_file: >-
    {{ media_root ~ ('/' ~ subfolder if subfolder else '') ~ '/motion_' ~ stamp ~ '.mp4' }}

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    from: "off"
    to: "on"

conditions:
  - condition: template
    value_template: >-
      {{ always_alert or (night_mode and is_night) or nobody_home }}

actions:
  - if:
      - condition: template
        value_template: "{{ save_snapshots }}"
    then:
      - action: camera.snapshot
        target:
          entity_id: !input camera
        data:
          filename: "{{ snapshot_file }}"

  - repeat:
      for_each: "{{ notify_services }}"
      sequence:
        - action: "notify.{{ repeat.item }}"
          data:
            title: "{{ notification_title }}"
            message: "Motion detected at {{ alert_time }}."
            data: >-
              {% set img = snapshot_url if save_snapshots else '/api/camera_proxy/' ~ camera_entity %}
              {% set d = {'image': img} %}
              {% if critical %}
                {% set d = dict(d,
                      push={'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}},
                      ttl=0,
                      priority='high',
                      channel='alarm_stream') %}
              {% endif %}
              {% if tap_target %}
                {% set d = dict(d, url=tap_target, clickAction=tap_target) %}
              {% endif %}
              {{ d }}

  - if:
      - condition: template
        value_template: "{{ persistent }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: "motion_{{ stamp }}"
          title: "{{ notification_title }}"
          message: |-
            Motion detected at {{ alert_time }} on {{ state_attr(camera_entity, 'friendly_name') or camera_entity }}.
            {%- if save_snapshots %}

            Snapshot: `{{ snapshot_file }}`
            {%- endif %}
            {%- if save_video %}

            Video: `{{ video_file }}`
            {%- endif %}

  - if:
      - condition: template
        value_template: "{{ save_video }}"
    then:
      - action: camera.record
        continue_on_error: true
        target:
          entity_id: !input camera
        data:
          filename: "{{ video_file }}"
          duration: "{{ video_duration }}"
          lookback: "{{ video_lookback }}"

mode: single
max_exceeded: silent
